name: Claude debug
# Temporary: finds out why the Claude step fails. Delete after the fix.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/claude-debug.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Reply with the single word: hello"
          show_full_output: true
          claude_args: |
            --max-turns 2
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.claude.outputs.execution_file }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          {
            echo "debug run ${{ github.run_id }}"
            echo "oauth secret set: $HAS_OAUTH, api key secret set: $HAS_KEY"
            echo "execution file: $FILE"
            echo '```'
            if [ -f "$FILE" ]; then
              jq -c '.[] | select(.type=="result" or .type=="assistant") | {type, is_error, result, text: (.message.content // [] | map(.text // empty) | join(" "))}' "$FILE" | tail -5 | cut -c1-1500
            else
              echo "no execution file"
            fi
            echo '```'
          } > body.md
          gh issue comment 2 --repo "${{ github.repository }}" --body-file body.md
